[package]
name = "rv-rsmf-gui"
description = "RV RSMF desktop interface (Windows 10/11, also builds on Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui/eframe 0.37 declare rust-version 1.95 (the rest of the workspace needs 1.88).
rust-version = "1.95"
authors.workspace = true

[[bin]]
name = "rv-rsmf-gui"
path = "src/main.rs"

[lib]
name = "rv_rsmf_gui"
path = "src/lib.rs"

[dependencies]
rv-rsmf-core.workspace = true
eframe.workspace = true
serde_json.workspace = true

# Native file/folder pickers on Windows (no GTK/portal dependency elsewhere: a text field is used instead).
[target.'cfg(windows)'.dependencies]
rfd.workspace = true

# Icon + version details in the Windows .exe (build.rs; does nothing on other platforms).
[build-dependencies]
winresource = "0.1"
